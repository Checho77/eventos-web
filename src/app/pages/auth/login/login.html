<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="titulo-pagina h3 text-center">Iniciar sesión</h1>
        <p class="subtitulo-pagina text-center">Ingresa con tu correo y contraseña</p>

        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input id="correo" type="email" class="form-control" placeholder="correo@ejemplo.com">
        </div>

        <div class="mb-3">
          <label for="clave" class="form-label">Contraseña</label>
          <input id="clave" type="password" class="form-control" placeholder="••••••••">
        </div>

        <button type="button" class="btn btn-primary w-100">Iniciar sesión</button>

        <p class="text-center mt-3 mb-0 small">
          ¿No tienes cuenta? <a routerLink="/auth/registro">Regístrate</a>
        </p>

        <div class="acceso-demo">
          <p class="small text-muted mb-2">Acceso de demostración (sin autenticación real)</p>
          <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a class="btn btn-outline-primary btn-sm" routerLink="/cliente/eventos">Cliente</a>
            <a class="btn btn-outline-primary btn-sm" routerLink="/agente/eventos">Agente</a>
            <a class="btn btn-outline-primary btn-sm" routerLink="/admin/dashboard">Administrador</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
